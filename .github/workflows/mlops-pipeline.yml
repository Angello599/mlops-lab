name: MLOps Pipeline

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run all jobs"
        required: false
        default: "true"

jobs:
  data-processing:
    name: Data Processing
    runs-on: ubuntu-24.04               # ubuntu-latest ya es Ubuntu 26.04 y no tiene Python 3.11.9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4            # reto: v2 -> v4

      - name: Set up Python
        uses: actions/setup-python@v5        # reto: v2 -> v5
        with:
          python-version: "3.11.9"
          cache: "pip"                       # reutiliza las dependencias entre ejecuciones

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process data
        run: |
          python src/data/run_processing.py --input data/raw/house_data.csv --output data/processed/cleaned_house_data.csv

      # Gate 1: si los datos limpios no cumplen el data contract, el pipeline se detiene aquí
      - name: Validate data contract
        run: |
          python src/data/validate.py --input data/processed/cleaned_house_data.csv

      # reto: subir el dataset limpio como artefacto processed-data
      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/cleaned_house_data.csv

  feature-engineering:
    name: Feature Engineering
    needs: data-processing
    runs-on: ubuntu-24.04               # ubuntu-latest ya es Ubuntu 26.04 y no tiene Python 3.11.9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4            # reto: v2 -> v4

      - name: Set up Python
        uses: actions/setup-python@v5        # reto: v2 -> v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Engineer features
        run: |
          mkdir -p models/trained
          python src/features/engineer.py --input data/processed/cleaned_house_data.csv --output data/processed/featured_house_data.csv --preprocessor models/trained/preprocessor.pkl

      # reto: subir el dataset con features como artefacto featured-data
      - name: Upload featured data
        uses: actions/upload-artifact@v4
        with:
          name: featured-data
          path: data/processed/featured_house_data.csv

      # reto: subir el preprocessor serializado como artefacto preprocessor
      - name: Upload preprocessor
        uses: actions/upload-artifact@v4
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl

  model-training:
    name: Model Training
    needs: feature-engineering
    runs-on: ubuntu-24.04               # ubuntu-latest ya es Ubuntu 26.04 y no tiene Python 3.11.9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Download featured data
        uses: actions/download-artifact@v4
        with:
          name: featured-data
          path: data/processed/

      - name: Set up MLflow
        run: |
          # Misma versión que en deployment/mlflow/docker-compose.yaml y requirements.txt
          docker run -d -p 5000:5000 --name mlflow-server ghcr.io/mlflow/mlflow:v2.22.1 \
            mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --artifacts-destination /tmp/mlartifacts

      - name: Wait for MLflow to start
        run: |
          for i in {1..20}; do
            curl -fs http://localhost:5000/health && break || sleep 3
          done
          curl -f http://localhost:5000/health

      - name: Train model
        run: |
          mkdir -p models
          python src/models/train_model.py --config configs/model_config.yaml --data data/processed/featured_house_data.csv --models-dir models --mlflow-tracking-uri http://localhost:5000

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/trained/house_price_model.pkl
            models/trained/house_price_model.yaml

      - name: Clean up MLflow
        if: always()
        run: |
          docker stop mlflow-server || true
          docker rm mlflow-server || true
